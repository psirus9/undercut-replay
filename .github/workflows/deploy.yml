name: Deploy to Firebase Hosting

# Runs when the page changes on main, after every race refresh, or by hand.
# A commit made by the refresh workflow can't trigger a push event, so workflow_run covers that case.
on:
  push:
    branches: [main]
    paths: ["site/**", "firebase.json"]
  workflow_run:
    workflows: ["Race refresh"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNDERCUT_REPLAY != '' }}
    steps:
      - name: Waiting for the Firebase key
        if: env.HAS_KEY != 'true'
        run: echo "No FIREBASE_SERVICE_ACCOUNT_UNDERCUT_REPLAY secret yet, so nothing was deployed."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          ref: main
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNDERCUT_REPLAY }}
          projectId: undercut-replay
          channelId: live
